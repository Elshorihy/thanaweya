<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thanaweya OS — لوحة المالك</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#121a2d;--line:#26314a;--text:#f5f7fb;--muted:#9aa7bf;--accent:#7c3aed;--danger:#ff8f9d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1c1740,transparent 35%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}.wrap{width:min(900px,100%)}.card{background:rgba(18,26,45,.95);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.3)}h1{margin:0 0 7px;font-size:28px}.muted{color:var(--muted);margin:0 0 20px}.form{max-width:430px;margin:auto}.field{display:block;margin:12px 0;color:var(--muted);font-size:13px}.field input{display:block;width:100%;margin-top:7px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0e1628;color:var(--text);font:inherit;outline:none}.btn{width:100%;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:8px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top .btn{width:auto;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:20px;border:1px solid var(--line);border-radius:16px;background:#0e1628}.stat span{display:block;color:var(--muted);font-size:13px}.stat b{display:block;font-size:34px;margin-top:8px}.error{color:var(--danger);font-size:13px;min-height:20px}.note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}.top .btn{width:100%}}
</style>
</head>
<body><main class="wrap">
<section id="loginCard" class="card">
<div class="form">
<h1>🔐 لوحة المالك</h1>
<p class="muted">سجّل دخولك لعرض إحصائيات الزوار.</p>
<form id="loginForm">
<label class="field">البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label>
<label class="field">كلمة السر<input id="password" type="password" autocomplete="current-password" required></label>
<button class="btn" type="submit">دخول</button>
<p id="loginError" class="error"></p>
</form>
</div>
</section>
<section id="statsCard" class="card" hidden>
<div class="top"><div><h1>إحصائيات الزوار 📊</h1><p class="muted">مرحبًا <span id="ownerName">Elshori7y</span></p></div><div><button id="refresh" class="btn">تحديث</button><button id="logout" class="btn" style="margin-top:8px">خروج</button></div></div>
<div class="grid">
<div class="stat"><span>إجمالي الزيارات الفريدة بالأيام</span><b id="total">—</b></div>
<div class="stat"><span>زوار اليوم</span><b id="today">—</b></div>
<div class="stat"><span>زوار آخر 7 أيام</span><b id="week">—</b></div>
</div>
<p id="error" class="note error"></p>
<p class="note">هذه الصفحة مخفية عن الموقع، لكن الحماية الحقيقية تعتمد على تسجيل الدخول. العدّ اليومي يستخدم معرّف اتصال مجزّأ ولا يخزن عنوان IP الخام.</p>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,credentials:'same-origin',cache:'no-store'});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'حدث خطأ في الخادم');return j}
async function loadStats(){ $('error').textContent=''; try{const j=await api('/api/owner/stats');$('total').textContent=Number(j.totalVisitors||0).toLocaleString('ar-EG');$('today').textContent=Number(j.todayVisitors||0).toLocaleString('ar-EG');$('week').textContent=Number(j.last7DaysVisitors||0).toLocaleString('ar-EG')}catch(e){if(String(e.message).includes('تسجيل الدخول'))showLogin();else $('error').textContent=e.message||'حدث خطأ'}} 
function showStats(u){$('loginCard').hidden=true;$('statsCard').hidden=false;$('ownerName').textContent=u?.name||'Elshori7y';loadStats()}
function showLogin(){$('statsCard').hidden=true;$('loginCard').hidden=false}
async function boot(){try{const j=await api('/api/owner/me');if(j.user)showStats(j.user);else showLogin()}catch{showLogin()}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const j=await api('/api/owner/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});if(j.user?.email!=='sheenomatp@gmail.com')throw Error('هذا الحساب ليس حساب المالك');showStats(j.user)}catch(e){$('loginError').textContent=e.message||'تعذر تسجيل الدخول'}};
$('refresh').onclick=loadStats;
$('logout').onclick=async()=>{try{await api('/api/owner/logout',{method:'POST'})}finally{showLogin()}};
boot();
</script></body></html>
