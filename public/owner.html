<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إحصائيات الزوار</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#121a2d;--line:#26314a;--text:#f5f7fb;--muted:#9aa7bf;--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1c1740,transparent 35%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}.wrap{width:min(900px,100%)}.card{background:rgba(18,26,45,.95);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.3)}h1{margin:0 0 7px;font-size:28px}.muted{color:var(--muted);margin:0 0 20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;font:inherit;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:20px;border:1px solid var(--line);border-radius:16px;background:#0e1628}.stat span{display:block;color:var(--muted);font-size:13px}.stat b{display:block;font-size:34px;margin-top:8px}.error{color:#ff8f9d;font-size:13px;min-height:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}.btn{width:100%}}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="top"><div><h1>إحصائيات الزوار 📊</h1><p class="muted">لوحة خاصة — افتح الرابط مباشرة.</p></div><button id="refresh" class="btn">تحديث</button></div>
<div class="grid">
<div class="stat"><span>إجمالي الزيارات الفريدة بالأيام</span><b id="total">—</b></div>
<div class="stat"><span>زوار اليوم</span><b id="today">—</b></div>
<div class="stat"><span>زوار آخر 7 أيام</span><b id="week">—</b></div>
</div><p id="error" class="error"></p>
</section></main>
<script>
const $=id=>document.getElementById(id);
async function loadStats(){
  $("error").textContent="";
  try{
    const r=await fetch("/api/owner/stats",{cache:"no-store"});
    let j={};try{j=await r.json()}catch{}
    if(!r.ok)throw Error(j.error||"حدث خطأ");
    $("total").textContent=Number(j.totalVisitors||0).toLocaleString("ar-EG");
    $("today").textContent=Number(j.todayVisitors||0).toLocaleString("ar-EG");
    $("week").textContent=Number(j.last7DaysVisitors||0).toLocaleString("ar-EG");
  }catch(e){$("error").textContent=e.message||"تعذر تحميل الإحصائيات"}
}
$("refresh").onclick=loadStats;loadStats();
</script></body></html>
