name: Fix achievement key 2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Fix achievement key 2') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 -c "from pathlib import Path; p=Path('src/main.tsx'); s=p.read_text(); s=s.replace('key={k}><Trophy/>', 'key={String(k)}><Trophy/>', 1); p.write_text(s)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git commit -m "Fix achievement key 2" || exit 0
          git push
