name: Deploy Thanaweya to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy-debug.log'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        run: |
          set +e
          npx wrangler deploy worker/index.ts --config wrangler.jsonc --log-level debug 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then exit "$code"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

