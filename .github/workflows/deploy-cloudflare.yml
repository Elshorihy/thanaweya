name: Deploy Thanaweya to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        run: |
          set +e
          npx wrangler deploy worker/index.ts --config wrangler.jsonc --log-level debug 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then exit "$code"; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save deployment error for diagnosis
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/deploy.log ]; then
            {
              echo "# Cloudflare deploy diagnostic"
              echo "Run: $GITHUB_RUN_ID"
              echo "Commit: $GITHUB_SHA"
              echo
              cat /tmp/deploy.log
            } > deploy-debug.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add deploy-debug.log
            git commit -m "Add Cloudflare deployment diagnostic"
            git push
          fi
