name: Deploy Thanaweya Worker CORS Fix

on:
  push:
    branches:
      - worker-cors-fix
    paths:
      - "worker/index.ts"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-worker-cors.yml"

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated CORS branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing project dependencies
        run: npm install --no-audit --no-fund --before=2026-09-30T00:00:00Z

      - name: Build the unchanged site assets and Worker dependencies
        run: npm run build

      - name: Validate deployment package
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker with existing bindings and variables
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Android WebView CORS
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://thanaweya.sheenomatp.workers.dev"
          ORIGIN="https://localhost"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' -X OPTIONS "$BASE/api/auth/login" \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type")"
          echo "Preflight HTTP: $status"
          test "$status" = "204"
          grep -qi "^access-control-allow-origin: $ORIGIN" "$headers"
          grep -qi "^access-control-allow-credentials: true" "$headers"

          curl -fsS -D "$headers" -o "$body" "$BASE/api/health" -H "Origin: $ORIGIN"
          grep -qi "^access-control-allow-origin: $ORIGIN" "$headers"
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(x.ok!==true || x.db!==true) process.exit(1)' "$body"
          echo "CORS preflight and API health passed for $ORIGIN."
          rm -f "$headers" "$body"
