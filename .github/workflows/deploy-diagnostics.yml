name: Capture Cloudflare Deploy Failure

on:
  workflow_run:
    workflows: ["Deploy Thanaweya to Cloudflare"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Capture failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log-failed > deploy-debug.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-debug.log
          git commit -m "Capture Cloudflare deploy failure log" || exit 0
          git push
