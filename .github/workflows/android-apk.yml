name: Build Thanaweya Android APK

on:
  push:
    branches: [mobile-app]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'src/**'
      - 'scripts/**'
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thanaweya-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install --no-audit --no-fund --before=2026-09-30T00:00:00Z

      - name: Type-check and build web app
        run: npm run build

      - name: Generate Android project and apply WebView session patch
        run: npm run cap:add:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thanaweya-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
