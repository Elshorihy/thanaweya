name: Deploy Thanaweya Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - run: npm run build
      - name: Prepare optional messaging secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_SECRET }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const keys = ['TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID','GREEN_API_INSTANCE_ID','GREEN_API_TOKEN','GREEN_API_URL','GOOGLE_APPS_SCRIPT_URL','GOOGLE_APPS_SCRIPT_SECRET'];
          const out = {};
          for (const key of keys) if (process.env[key]) out[key] = process.env[key];
          fs.writeFileSync('.secrets.json', JSON.stringify(out));
          NODE

      - name: Deploy Worker with secrets
        run: npx wrangler deploy --secrets-file .secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Refresh Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            node -e 'const token=process.env.TELEGRAM_BOT_TOKEN; const url="https://thanaweya.sheenomatp.workers.dev/api/telegram/webhook"; fetch("https://api.telegram.org/bot"+token+"/setWebhook",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({url})}).then(async r=>{const text=await r.text(); console.log(text); if(!r.ok) process.exit(1)}).catch(err=>{console.error(err);process.exit(1)})'
          fi
 
# Telegram secrets are configured via GitHub Actions secrets.
# Use Node 24 on GitHub Actions runners.
