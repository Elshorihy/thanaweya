name: Deploy Thanaweya Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure optional messaging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
            printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
            curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
              -H 'content-type: application/json' \
              --data "{\"url\":\"https://thanaweya.sheenomatp.workers.dev/api/telegram/webhook\"}"
          else
            echo "Telegram secrets not configured; skipping Telegram setup."
          fi

          if [ -n "$GREEN_API_INSTANCE_ID" ] && [ -n "$GREEN_API_TOKEN" ]; then
            printf '%s' "$GREEN_API_INSTANCE_ID" | npx wrangler secret put GREEN_API_INSTANCE_ID
            printf '%s' "$GREEN_API_TOKEN" | npx wrangler secret put GREEN_API_TOKEN
            if [ -n "$GREEN_API_URL" ]; then
              printf '%s' "$GREEN_API_URL" | npx wrangler secret put GREEN_API_URL
            fi
            echo "GREEN-API secrets configured."
          else
            echo "GREEN-API secrets not configured; skipping WhatsApp setup."
          fi

# Telegram secrets are configured via GitHub Actions secrets.
# Use Node 24 on GitHub Actions runners.
