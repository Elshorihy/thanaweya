name: Deploy Thanaweya Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund --before=2026-09-30T00:00:00Z

      - run: npm run build
      - name: Ensure VAPID secrets exist in Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SECRET_LIST="$(npx wrangler secret list --format json)"
          if node -e 'const x=JSON.parse(process.argv[1]); const names=new Set((x||[]).map(s=>s.name)); process.exit(["VAPID_PUBLIC_KEY","VAPID_PRIVATE_KEY","VAPID_SUBJECT"].every(n=>names.has(n))?0:1)' "$SECRET_LIST"; then
            echo "VAPID secrets already exist in Cloudflare."
          else
            echo "Generating VAPID keys once and storing them in Cloudflare Secrets..."
            node --input-type=module -e "import fs from 'fs'; import { generateVAPIDKeys } from 'web-push-neo'; const keys=await generateVAPIDKeys(); fs.writeFileSync('.vapid-secrets.json', JSON.stringify({VAPID_PUBLIC_KEY:keys.publicKey,VAPID_PRIVATE_KEY:keys.privateKey,VAPID_SUBJECT:'https://thanaweya.sheenomatp.workers.dev'}));"
            npx wrangler secret bulk .vapid-secrets.json
            rm -f .vapid-secrets.json
            echo "VAPID secrets created successfully."
          fi

      - name: Prepare optional messaging secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const keys = ['TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID','GREEN_API_INSTANCE_ID','GREEN_API_TOKEN','GREEN_API_URL','GOOGLE_APPS_SCRIPT_URL','GOOGLE_APPS_SCRIPT_SECRET','VAPID_PUBLIC_KEY','VAPID_PRIVATE_KEY','VAPID_SUBJECT'];
          const out = {};
          for (const key of keys) if (process.env[key]) out[key] = process.env[key];
          fs.writeFileSync('.secrets.json', JSON.stringify(out));
          NODE

      - name: Deploy Worker with secrets
        run: npx wrangler deploy --secrets-file .secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Refresh Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            node -e 'const token=process.env.TELEGRAM_BOT_TOKEN; const url="https://thanaweya.sheenomatp.workers.dev/api/telegram/webhook"; fetch("https://api.telegram.org/bot"+token+"/setWebhook",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({url,allowed_updates:["message","callback_query"],drop_pending_updates:false})}).then(async r=>{const text=await r.text(); console.log(text); if(!r.ok) process.exit(1)}).catch(err=>{console.error(err);process.exit(1)})'
          fi
 
# Telegram secrets are configured via GitHub Actions secrets.
# Use Node 24 on GitHub Actions runners.
